<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" aria-label="Tokens por modo: Completo, Ligero y Búsqueda" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" viewBox="0 0 1000 300"><title>Tokens por modo: Completo, Ligero y Búsqueda</title><rect width="1000" height="300" fill="#fff" rx="20"/><text x="32" y="46" fill="#1f2328" font-size="22" font-weight="700">Tokens que ocupan las herramientas en cada conversación</text><text x="32" y="72" fill="#59636e" font-size="15">Aproximado (caracteres ÷ 4), medido sobre el servidor real. Menos tokens = conversaciones más largas.</text><text x="234" y="108" fill="#1f2328" font-size="17" font-weight="600" text-anchor="end">Completo</text><text x="234" y="128" fill="#59636e" font-size="14" text-anchor="end">Claude ve 241 herramientas</text><path fill="#c8102e" d="M250 92 h556.0 a4 4 0 0 1 4 4 v26 a4 4 0 0 1 -4 4 h-556.0 z"/><text x="822" y="115" fill="#1f2328" font-size="17" font-weight="600">≈ 97.300</text><text x="234" y="170" fill="#1f2328" font-size="17" font-weight="600" text-anchor="end">Ligero (recomendado)</text><text x="234" y="190" fill="#59636e" font-size="14" text-anchor="end">Claude ve 66 herramientas</text><path fill="#c8102e" d="M250 154 h154.77899626915527 a4 4 0 0 1 4 4 v26 a4 4 0 0 1 -4 4 h-154.77899626915527 z"/><text x="420.779" y="177" fill="#1f2328" font-size="17" font-weight="600">≈ 27.600</text><text x="234" y="232" fill="#1f2328" font-size="17" font-weight="600" text-anchor="end">Búsqueda</text><text x="234" y="252" fill="#59636e" font-size="14" text-anchor="end">Claude ve 3 herramientas</text><path fill="#c8102e" d="M250 216 h2.0 a2.0 2.0 0 0 1 2.0 2.0 v30.0 a2.0 2.0 0 0 1 -2.0 2.0 h-2.0 z"/><text x="266" y="239" fill="#1f2328" font-size="17" font-weight="600">≈ 550</text><line x1="250" x2="250" y1="82" y2="260" stroke="#59636e" stroke-width="1"/></svg>