<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" aria-label="Cómo funciona: Claude Desktop, MCP AutoCAD y AutoCAD" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" viewBox="0 0 1200 330"><title>Cómo funciona: Claude Desktop, MCP AutoCAD y AutoCAD</title><rect width="1200" height="330" fill="#0d1117" rx="20"/><rect width="320" height="230" x="20" y="40" fill="#161b22" stroke="#30363d" rx="16"/><rect width="34" height="26" x="44" y="58" fill="none" stroke="#f2405a" stroke-width="3" rx="8"/><path fill="#f2405a" d="M54 84 l-4 9 l12 -9"/><text x="44" y="112" fill="#e6edf3" font-size="22" font-weight="700">1. Le pides a Claude</text><text x="44" y="148" fill="#9198a1" font-size="17">En Claude Desktop, con tus</text><text x="44" y="174" fill="#9198a1" font-size="17">palabras: «dibuja un</text><text x="44" y="200" fill="#9198a1" font-size="17">rectángulo de 100 × 50».</text><rect width="320" height="230" x="440" y="40" fill="#161b22" stroke="#30363d" rx="16"/><g transform="translate(462 54)"><rect width="33.12" height="33.12" x="1.44" y="1.44" fill="#f2405a" rx="7.2"/><rect width="9.36" height="9.36" x="13.32" y="13.32" fill="none" stroke="#fff" stroke-width="2.52"/><line x1="5.04" x2="11.16" y1="18" y2="18" stroke="#fff" stroke-width="2.52"/><line x1="24.84" x2="30.96" y1="18" y2="18" stroke="#fff" stroke-width="2.52"/><line x1="18" x2="18" y1="5.04" y2="11.16" stroke="#fff" stroke-width="2.52"/><line x1="18" x2="18" y1="24.84" y2="30.96" stroke="#fff" stroke-width="2.52"/></g><text x="464" y="112" fill="#e6edf3" font-size="22" font-weight="700">2. MCP AutoCAD</text><text x="464" y="148" fill="#9198a1" font-size="17">El programa de tu PC traduce</text><text x="464" y="174" fill="#9198a1" font-size="17">la petición en órdenes de</text><text x="464" y="200" fill="#9198a1" font-size="17">AutoCAD. Tú eliges qué ve Claude.</text><rect width="320" height="230" x="860" y="40" fill="#161b22" stroke="#30363d" rx="16"/><rect width="38" height="30" x="884" y="56" fill="none" stroke="#f2405a" stroke-width="3"/><line x1="903" x2="903" y1="56" y2="86" stroke="#f2405a" stroke-width="2"/><text x="884" y="112" fill="#e6edf3" font-size="22" font-weight="700">3. AutoCAD dibuja</text><text x="884" y="148" fill="#9198a1" font-size="17">En tu dibujo abierto, en vivo.</text><text x="884" y="174" fill="#9198a1" font-size="17">Claude revisa el resultado y</text><text x="884" y="200" fill="#9198a1" font-size="17">te lo cuenta.</text><line x1="348" x2="422" y1="155" y2="155" stroke="#f2405a" stroke-width="3"/><path fill="#f2405a" d="M432 155.0 l-14 -8 v16 z"/><text x="390" y="141" fill="#9198a1" font-size="16" text-anchor="middle">pide</text><line x1="768" x2="842" y1="155" y2="155" stroke="#f2405a" stroke-width="3"/><path fill="#f2405a" d="M852 155.0 l-14 -8 v16 z"/><text x="810" y="141" fill="#9198a1" font-size="16" text-anchor="middle">dibuja</text><text x="600" y="312" fill="#9198a1" font-size="16" text-anchor="middle">El programa y AutoCAD trabajan en tu PC. Claude recibe solo lo que las herramientas le responden.</text></svg>