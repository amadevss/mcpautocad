<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Cómo funciona: Claude Desktop, MCP AutoCAD y AutoCAD" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Cómo funciona: Claude Desktop, MCP AutoCAD y AutoCAD</title><rect width="1200" height="330" rx="20" fill="#0d1117"/><rect x="20" y="40" width="320" height="230" rx="16" fill="#161b22" stroke="#30363d"/><rect x="44" y="58" width="34" height="26" rx="8" fill="none" stroke="#f2405a" stroke-width="3"/><path d="M54 84 l-4 9 l12 -9" fill="#f2405a"/><text x="44" y="112" fill="#e6edf3" font-size="22" font-weight="700">1. Le pides a Claude</text><text x="44" y="148" fill="#9198a1" font-size="17">En Claude Desktop, con tus</text><text x="44" y="174" fill="#9198a1" font-size="17">palabras: «dibuja un</text><text x="44" y="200" fill="#9198a1" font-size="17">rectángulo de 100 × 50».</text><rect x="440" y="40" width="320" height="230" rx="16" fill="#161b22" stroke="#30363d"/><g transform="translate(462 54)"><rect x="1.44" y="1.44" width="33.120000000000005" height="33.120000000000005" rx="7.2" fill="#f2405a"/><rect x="13.32" y="13.32" width="9.36" height="9.36" fill="none" stroke="#fff" stroke-width="2.5200000000000005"/><line x1="5.040000000000001" y1="18.0" x2="11.16" y2="18.0" stroke="#fff" stroke-width="2.5200000000000005"/><line x1="24.84" y1="18.0" x2="30.96" y2="18.0" stroke="#fff" stroke-width="2.5200000000000005"/><line x1="18.0" y1="5.040000000000001" x2="18.0" y2="11.16" stroke="#fff" stroke-width="2.5200000000000005"/><line x1="18.0" y1="24.84" x2="18.0" y2="30.96" stroke="#fff" stroke-width="2.5200000000000005"/></g><text x="464" y="112" fill="#e6edf3" font-size="22" font-weight="700">2. MCP AutoCAD</text><text x="464" y="148" fill="#9198a1" font-size="17">El programa de tu PC traduce</text><text x="464" y="174" fill="#9198a1" font-size="17">la petición en órdenes de</text><text x="464" y="200" fill="#9198a1" font-size="17">AutoCAD. Tú eliges qué ve Claude.</text><rect x="860" y="40" width="320" height="230" rx="16" fill="#161b22" stroke="#30363d"/><rect x="884" y="56" width="38" height="30" fill="none" stroke="#f2405a" stroke-width="3"/><line x1="903" y1="56" x2="903" y2="86" stroke="#f2405a" stroke-width="2"/><text x="884" y="112" fill="#e6edf3" font-size="22" font-weight="700">3. AutoCAD dibuja</text><text x="884" y="148" fill="#9198a1" font-size="17">En tu dibujo abierto, en vivo.</text><text x="884" y="174" fill="#9198a1" font-size="17">Claude revisa el resultado y</text><text x="884" y="200" fill="#9198a1" font-size="17">te lo cuenta.</text><line x1="348" y1="155.0" x2="422" y2="155.0" stroke="#f2405a" stroke-width="3"/><path d="M432 155.0 l-14 -8 v16 z" fill="#f2405a"/><text x="390.0" y="141.0" fill="#9198a1" font-size="16" text-anchor="middle">pide</text><line x1="768" y1="155.0" x2="842" y2="155.0" stroke="#f2405a" stroke-width="3"/><path d="M852 155.0 l-14 -8 v16 z" fill="#f2405a"/><text x="810.0" y="141.0" fill="#9198a1" font-size="16" text-anchor="middle">dibuja</text><text x="600.0" y="312" fill="#9198a1" font-size="16" text-anchor="middle">El programa y AutoCAD trabajan en tu PC. Claude recibe solo lo que las herramientas le responden.</text></svg>
